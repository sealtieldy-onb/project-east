services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${EAST_DB_NAME:-east}
      POSTGRES_USER: ${EAST_DB_USER:-east}
      POSTGRES_PASSWORD: ${EAST_DB_PASSWORD:?Set EAST_DB_PASSWORD in the untracked root .env file}
    ports:
      - "127.0.0.1:${EAST_DB_PORT:-15432}:5432"
    volumes:
      - east-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  east-postgres-data:
